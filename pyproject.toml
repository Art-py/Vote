[project]
name = "vote"
version = "0.1.0"
description = "Anonymous character voting service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.5,<6.0",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<1.0",
    "openpyxl>=3.1,<4.0",
    "pillow>=11.0,<13.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.2,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.11,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
